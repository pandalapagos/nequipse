# Despliegue a Azure App Service (Linux + Node 24)
#
# OBLIGATORIO en GitHub → Settings → Secrets → Actions:
#   AZURE_WEBAPP_PUBLISH_PROFILE  (XML del perfil de publicación de Azure)
#
# Cambia AZURE_WEBAPP_NAME por el nombre EXACTO de tu App Service.

name: Deploy Node.js to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: recargaps3nequi

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar package.json
        run: |
          test -f package.json || (echo "ERROR: package.json no está en la raíz del repo" && exit 1)
          head -5 package.json

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Verificar artefacto antes de deploy
        run: |
          ls -la
          test -f server.js
          test -d node_modules/express

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
          startup-command: 'node server.js'
