# Despliegue a Azure App Service (Linux + Node 24)
# Requiere secreto en GitHub: AZURE_WEBAPP_PUBLISH_PROFILE
# (Azure Portal → App Service → Obtener perfil de publicación → copiar XML completo)

name: Deploy Node.js to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  # Cambia esto por el nombre EXACTO de tu App Service en Azure
  AZURE_WEBAPP_NAME: nequipse

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
