services:
  - type: web
    name: caja-social-telegram
    runtime: node
    rootDir: Caja-Social-nuevo
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
